  <line x1="0" y1="240" x2="640" y2="240" stroke="#00E5FF" stroke-opacity="0.05"/>
  <line x1="213" y1="0" x2="213" y2="360" stroke="#00E5FF" stroke-opacity="0.05"/>
  <line x1="427" y1="0" x2="427" y2="360" stroke="#00E5FF" stroke-opacity="0.05"/>
  <!-- Central gem / logo mark -->
